[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-passive-recon"
version = "1.0.0"
description = "Passive recon engine — subdomain enumeration, HTTP fingerprinting and GitHub dork scanning across 8 OSINT sources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["osint", "recon", "subdomain", "passive", "fingerprinting", "security", "pentest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = ["aiohttp>=3.9.0", "rich>=13.7.0"]

[project.scripts]
vamp-passive-recon = "vamp_passive_recon:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-passive-recon"
Repository = "https://github.com/Vampsecure-Labs/vamp-passive-recon"

[tool.setuptools]
py-modules = ["vamp_passive_recon", "asm", "headers", "reporter", "sources"]
